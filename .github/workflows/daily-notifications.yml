name: Daily Email Notifications

on:
  schedule:
    # Run twice daily: 9 AM and 6 PM UTC (adjust for your timezone)
    - cron: '0 9,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-notifications:
    name: Send Email Notifications
    runs-on: ubuntu-latest
    
    steps:
    - name: Send Deadline Reminders
      run: |
        BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
        
        if [ -z "$BACKEND_URL" ]; then
          echo "⚠️ RENDER_BACKEND_URL secret not set"
          exit 0
        fi
        
        echo "📧 Triggering deadline reminder check..."
        
        # This would require a special endpoint that processes all users
        # For now, this is a placeholder - you'll need to implement a batch endpoint
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${BACKEND_URL}/api/notifications/batch/deadline-reminders" -X POST || echo "000")
        
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Deadline reminders sent successfully!"
        else
          echo "⚠️ Backend returned HTTP $RESPONSE"
        fi
        
    - name: Send Daily Summary (Optional)
      run: |
        BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
        
        if [ -z "$BACKEND_URL" ]; then
          exit 0
        fi
        
        echo "📊 Triggering daily summary emails..."
        
        # This would send daily summaries to users who opted in
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${BACKEND_URL}/api/notifications/batch/daily-summary" -X POST || echo "000")
        
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Daily summaries sent successfully!"
        else
          echo "⚠️ Backend returned HTTP $RESPONSE"
        fi
